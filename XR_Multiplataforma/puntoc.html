<!DOCTYPE html>
<html>
<head>
    <title>Mi primer entorno XR</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>

<body>

    <a-scene>

    <!-- PISO -->
    <a-plane
        rotation="-90 0 0"
        width="12"
        height="12"
        color="#555555">
    </a-plane>


    <!-- BANDA TRANSPORTADORA -->
    <a-box
        position="0 1 -4"
        width="6"
        height="0.3"
        depth="1.5"
        color="#222222">
    </a-box>


    <!-- SOPORTE IZQUIERDO -->
    <a-box
        position="-2.2 0.5 -4"
        width="0.3"
        height="1"
        depth="1.2"
        color="#777777">
    </a-box>


    <!-- SOPORTE DERECHO -->
    <a-box
        position="2.2 0.5 -4"
        width="0.3"
        height="1"
        depth="1.2"
        color="#777777">
    </a-box>


    <!-- RODILLO IZQUIERDO -->
    <a-cylinder
        position="-2.5 1 -4"
        rotation="0 0 90"
        radius="0.5"
        height="1.4"
        color="#888888">
    </a-cylinder>


    <!-- RODILLO DERECHO -->
    <a-cylinder
        position="2.5 1 -4"
        rotation="0 0 90"
        radius="0.5"
        height="1.4"
        color="#888888">
    </a-cylinder>


    <!-- PRODUCTO SOBRE LA BANDA -->
    <a-box
        position="0 1.5 -4"
        width="0.8"
        height="0.8"
        depth="0.8"
        color="#FFAA00">
    </a-box>


    <!-- SENSOR -->
    <a-sphere
        position="0 2 -4"
        radius="0.2"
        color="#FF0000">
    </a-sphere>


    <!-- CIELO -->
    <a-sky color="#ECECEC"></a-sky>

</a-scene>


</body>
</html>
